# ─────────────────────────────────────────────────────────────
#  CTMC · Crypto Trade Meme Coins — configuration
#  Event-driven: buys fire the moment a watched celebrity tweets a coin.
# ─────────────────────────────────────────────────────────────

mode: paper            # paper | live   (live needs WALLET_PRIVATE_KEY + --i-understand-the-risk)
chain: solana

bankroll:
  starting_usd: 500          # paper balance
  max_open_positions: 4
  risk_per_trade_pct: 10     # % of equity per celebrity entry
  reserve_pct: 30            # never deploy this slice of equity
  daily_loss_limit_pct: 15

# ── Who can trigger a buy ─────────────────────────────────────
# Use the numeric X user ID (never just the handle): handles can be
# changed or impersonated, the ID can't. Find an ID at tweeterid.com.
# keywords: names a narrative coin would use (their name, nicknames, catchphrases).
# Leave id "" to have it looked up from X at startup (needs X_BEARER_TOKEN).
celebrities:
  - { handle: elonmusk,        id: "44196397",           keywords: [elon, musk, doge, kekius, xai, grok] }
  - { handle: realDonaldTrump, id: "25073877",           keywords: [trump, maga, melania, barron] }
  - { handle: cz_binance,      id: "902926941413453824", keywords: [binance, bnb] }
  - { handle: saylor,          id: "244647486",          keywords: [saylor] }
  - { handle: Cobratate,       id: "",                   keywords: [tate, topg, cobra, tristan, hustlers] }
  # - { handle: someone,       id: "123...",             keywords: [nickname, catchphrase] }

twitter:
  source: x_stream           # x_stream (official X API filtered stream) | webhook (any alert service POSTs to us)
  webhook_port: 8787
  max_tweet_age_seconds: 20  # ignore stale tweets (stream reconnects, replays)
  ignore_replies: true       # a reply mentioning a coin is weaker than an original post
  ticker_min_liquidity_usd: 250000   # a $TICKER with no address must resolve to a big, established coin

# Governing tokens: if these dump, the long tail follows.
leaders:
  SOL:      So11111111111111111111111111111111111111112
  WIF:      EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm
  FARTCOIN: 9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump

leader_feed:                 # real-time leader prices (Binance websockets, free). Others fall back to Jupiter.
  binance: true
  symbols: { SOL: "spot:SOLUSDT", WIF: "spot:WIFUSDT" }   # add FARTCOIN: "futures:FARTCOINUSDT" if listed

leader_guard:
  enabled: true
  window_minutes: 5
  exit_drop_pct: 4.0         # celebrity coins move on their own; only bail on a real leader crash
  block_entries_drop_pct: 2.5
  release_ratio: 0.5         # once blocked, stay blocked until leaders recover to half that drop
  stale_seconds: 90          # leader prices stopped updating -> no buys (the guard would be blind)

# ── Hard filters (a coin failing ANY is never bought) ─────────
universe:
  min_liquidity_usd: 75000       # summed across every DEX pool
  min_volume_1h_usd: 50000
  min_pair_age_minutes: 0        # celebrity plays are often new; safety + clusters do the protecting
  max_mcap_to_liquidity: 30      # market cap / pooled liquidity; higher = a few sells crater it

safety:
  require_mint_authority_revoked: true
  require_freeze_authority_revoked: true
  min_lp_locked_or_burned_pct: 90
  max_top10_holders_pct: 30        # pools, lockers and exchanges excluded
  max_single_holder_pct: 8
  max_insider_cluster_pct: 15
  max_rugcheck_score: 1000
  max_transfer_fee_pct: 0          # any tax on transfers = reject
  block_token2022_extensions: [permanentDelegate, transferHook, nonTransferable, defaultAccountState]
  reject_mutable_metadata: false   # mutable name/image is a warning, not a reject
  min_holders: 200
  max_dev_holding_pct: 5           # creator wallet's share of supply
  max_creator_tokens: 10           # creator launched more than this = serial launcher

clusters:                    # bubble-map style: which top holders were funded by the same wallet
  enabled: true
  top_holders: 20
  max_cluster_pct: 12        # one funder's wallets together may hold at most this
  max_dev_linked_pct: 5      # wallets funded by / funding the creator
  max_signatures_scan: 1000  # older, busier wallets are treated as independent

# ── Rule profiles by market cap ───────────────────────────────
# EARLY = catching it small, before the millions. Smaller bets: most small coins still die.
profiles:
  early:
    min_mcap_usd: 20000
    max_mcap_usd: 1500000
    risk_per_trade_pct: 4
    universe: { min_liquidity_usd: 12000, min_volume_1h_usd: 8000, max_mcap_to_liquidity: 60 }
    safety:   { min_holders: 40, max_top10_holders_pct: 25, max_insider_cluster_pct: 10, max_dev_holding_pct: 5 }
    lp_exempt_market_types: [pump_fun, pumpfun, raydium_launchlab, meteora_dbc]   # bonding curves can't be LP-pulled
  # anything above max_mcap_usd uses the main universe / safety rules

# ── Smart money: KOL + celebrity wallets ──────────────────────
kol:
  enabled: true
  registry: data/kols.json
  # quality — do they actually make money?
  min_win_rate: 55
  min_pnl_30d_usd: 5000
  min_closed_trades: 20
  max_rug_rate: 0.35
  pnl_for_full_score: 100000
  # followability — can we act on their moves in time?
  min_median_hold_s: 300         # wallets that flip in seconds are bots to us: ignored
  full_follow_hold_s: 3600
  max_trades_7d: 1500
  max_flip_rate: 0.6
  # entries
  check_balances_on_entry: true  # on a celebrity tweet: which proven wallets already hold it?
  balance_check_top_n: 25
  size_step_per_weight: 0.5      # size multiplier = 1 + 0.5 x total smart-money weight ...
  max_size_multiplier: 2.0       # ... capped at 2x
  cluster_window_s: 900          # proven wallets buying the same coin within 15 min = a cluster
  cluster_min_wallets: 3
  cluster_min_weight: 1.5
  allow_cluster_entries_without_celebrity: false   # you asked for celebrity hype only
  # decoding their sells
  full_exit_fraction: 0.9        # sold >= 90% of their bag = they're out
  early_exit_fraction: 0.5       # out in under half their usual hold time = they know something
  early_exit_min_weight: 0.4
  trim_share: 0.25               # 25% of the smart money out -> sell half of what's left
  exit_share: 0.5                # 50% out -> sell everything

# ── Celebrity-name narrative coins (the Andrew Tate effect) ───
narrative:
  enabled: true
  hot_hours: 12                  # a celebrity stays "hot" this long after posting
  lookback_hours: 72             # only coins launched in this window
  radar_hours: 24
  radar_max: 200
  min_keyword_len: 3
  max_keywords_per_tweet: 4
  search_on_tweet: true          # also search all DEXes for coins named after the post
  new_token_stream: true         # PumpPortal: every new pump.fun launch, free

rugwatch:                    # after buying: watch for the rug in real time
  enabled: true
  lp_pull_pct: 25            # liquidity removed beyond what the price move explains
  lp_window_seconds: 60
  dev_sell_pct: 10           # creator sells this share of their bag -> out
  min_dev_pct_to_watch: 0.1  # ignore a dev holding dust
  watch_top_holders: 10
  whale_supply_dumped_pct: 5 # top holders together dump this share of supply -> out
  poll_seconds: 5            # balance polling while the websocket is down

notify:                      # phone alerts: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID and/or DISCORD_WEBHOOK_URL
  kinds: [BUY, SELL, HALT, KOL]   # rug alerts / pauses always come through
  dedup_seconds: 60

postbuy:                     # checks that run AFTER buying — can only reduce risk
  engagement_check: true     # ~1 min after the post: is it catching on vs this celebrity's usual?
  engagement_after_s: 60
  engagement_min_history: 5  # needs 5 of their past coin posts before judging
  engagement_weak_ratio: 0.5 # under half their usual engagement -> sell half
  grok_review: true          # Grok's read of the X hype after buying (needs XAI_API_KEY)

hype:                        # Grok second opinion (adds 10-30s, so OFF on the instant path)
  confirm_with_grok: false
  model: grok-4
  min_score: 65
  min_credible_accounts: 2
  cache_minutes: 30

checks:
  timeout_seconds: 4         # all checks run in parallel; anything slower = no trade
  round_trip: true           # quote buy -> sell before buying: catches honeypots and hidden taxes
  round_trip_usd: 50
  max_round_trip_cost_pct: 15
  late_pump_pct_1h: 300      # already up 300%+ this hour -> half size
  very_late_pump_pct_1h: 1000  # up 1000%+ -> quarter size

protections:                 # the brakes (all survive restarts)
  halt_file: data/HALT       # exists = no buys. Telegram /pause creates it, /resume removes it
  max_buys_per_day: 12
  max_buys_per_signal_per_day: 3
  coin_cooldown_minutes: 60  # no re-buying a coin right after selling it
  stopout_limit: 3           # 3 ANOMALY exits (rug alert / leader crash / stop within 2 min of buying) ...
  stopout_lookback_hours: 24 # ... within 24h ...
  stopout_pause_hours: 12    # ... pause new buys 12h. Ordinary -30% stops don't count (they're normal here)
  max_drawdown_pct: 30       # equity 30% under its peak ...
  drawdown_lookback_hours: 72
  drawdown_pause_hours: 24   # ... pause 24h
  scorecard_days: 30         # each celebrity / signal judged on its own last 30 days:
  min_outcomes: 15           #   after 15+ trades (fewer = mostly luck) ...
  weak_hit_rate: 0.12        #   <= 12% reached 2x -> half size
  bench_hit_rate: 0.05       #   <= 5% reached 2x -> benched ...
  bench_days: 7              #   ... for 7 days
  losing_streak: 0           # off: long losing streaks are NORMAL for a few-big-winners strategy

# ── Exits ─────────────────────────────────────────────────────
exits:
  take_initial_at_multiple: 2.0      # at 2x: sell exactly what you put in. Rest is free.
  ladder: [10, 30, 50, 100]          # at each multiple: sell half of what is left
  ladder_sell_fraction: 0.5
  after_ladder_every_x: 2.0          # past 100x: halve again at 200x, 400x, ...
  final_exit_multiple: 1000          # ... and sell whatever is left here (halving alone never reaches zero)
  dust_usd: 5                        # close out when the bag is worth less than this
  volume_death_ratio: 0.25           # 5m volume < 25% of normal 5m volume ...
  volume_death_checks: 6             #   ... for this many checks in a row -> sell everything
  crash_trailing_stop_pct: 50        # backstop only: runner -50% from its peak
  profit_floors: [[10, 6], [30, 21], [100, 75], [300, 240]]   # the bigger the run, the tighter the lock:
                                     # peaked 10x -> keep >= 6x (-40%), 30x -> 21x (-30%), 100x -> 75x (-25%), 300x -> 240x (-20%)
  hard_stop_loss_pct: 30             # before the 2x is reached
  max_hold_hours: 0                  # 0 = no time limit, let volume decide
  no_2x_exit_hours: 24               # time barrier: never reached 2x within 24h -> out (0 = off)

flow:
  dryup_buy_ratio: 0.6           # buys/sells in 5m below this -> buyers dried up
  heavy_sell_volume_mult: 2.0    # 5m sell volume vs normal -> major sales coming in
  capitulation_drop_pct: 12      # dip re-entry (celebrity-backed coins only): -12% in 1h ...
  capitulation_sell_ratio: 1.8   #   ... with sells swamping buys ...
  exhaustion_sell_ratio: 1.1     #   ... then buy once sellers are spent

# ── Execution ─────────────────────────────────────────────────
execution:
  router: jupiter              # routes across every Solana DEX (Raydium, Orca, Meteora, Pump AMM, ...)
  max_price_impact_pct: 3      # shrink the order until the route moves price less than this
  buy_slippage_bps: 300        # 3%
  sell_slippage_bps: 500       # 5% normally ...
  panic_sell_slippage_bps: [800, 1500, 2500]   # ... escalating retries when we MUST get out
  paper_fee_pct: 0.3
  min_sol_reserve: 0.1         # always keep this much SOL for fees; buys stop below it
  max_entry_drift_pct: 25      # chase guard: price ran more than this since the checks -> no buy
  max_priority_fee_lamports: 3000000
  jito_tip_lamports: 0         # > 0: send privately via Jito with this tip (sandwich protection)

monitor:
  metrics_refresh_seconds: 3   # volume / buys / sells for open positions
  price_refresh_seconds: 2     # Jupiter price feed (free key = 60 calls/min: keep >= 2s)
  equity_snapshot_seconds: 60
